<div style="padding: 20px; max-width: 800px; margin: 20px auto;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>Dashboard</h2>
    <button (click)="logout()" [disabled]="logoutLoading"
      style="padding: 8px 16px; background: #d13438; color: white; border: none; border-radius: 4px; cursor: pointer;"
      [style.background]="logoutLoading ? '#6c757d' : '#d13438'">
      {{ logoutLoading ? 'Logging out...' : 'Logout' }}
    </button>
  </div>


</div>

<!-- Added LMS and RRF cards -->
<div style="display: flex; gap: 20px; margin-top: 20px;">

  <div style="flex: 1; background: #e0f7fa; padding: 20px; border-radius: 8px; text-align: center;">
    <h4>LMS App</h4>
    <p>Access the Learning Management System</p>
    <button (click)="redirectToLMS()"
      style="padding: 8px 16px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Go to LMS
    </button>
  </div>

  <div style="flex: 1; background: #fff3e0; padding: 20px; border-radius: 8px; text-align: center;">
    <h4>RRF App</h4>
    <p>Access the RRF Application</p>
    <button (click)="redirectToRRF()"
      style="padding: 8px 16px; background: #f57c00; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Go to RRF
    </button>
  </div>

</div>
